<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MultiFeed LinkedIn Bridge</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f17;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0a66c2, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
    }
    h2 {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .status-label {
      color: #94a3b8;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      font-size: 11.5px;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .badge-online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .dot-green { background: #10b981; }
    .dot-red { background: #ef4444; }
    .hint {
      font-size: 11.5px;
      color: #64748b;
      line-height: 1.4;
      background: rgba(10, 102, 194, 0.08);
      border-left: 3px solid #0a66c2;
      padding: 8px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">in</div>
    <div>
      <h2>MultiFeed Bridge</h2>
      <div class="subtitle">Local LinkedIn Scraper ($0.00)</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Local Server:</span>
      <span id="server-status" class="status-badge badge-offline">
        <span class="dot dot-red"></span> Disconnected
      </span>
    </div>
    <div class="status-row">
      <span class="status-label">LinkedIn Session:</span>
      <span id="li-status" class="status-badge badge-online">
        <span class="dot dot-green"></span> Ready
      </span>
    </div>
  </div>

  <div class="hint">
    ✨ Keep this extension active while searching LinkedIn on MultiFeed. All requests will use your browser session at <strong>$0.00 cost</strong>.
  </div>

  <button id="reconnect-btn" class="btn">Reconnect to Server</button>

  <script src="popup.js"></script>
</body>
</html>
